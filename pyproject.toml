[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "agent-whatsapp"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "audioop-lts>=0.2.2",
    "ollama>=0.6.2",
    "pyautogui>=0.9.54",
    "pydub>=0.25.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "pywhatkit>=5.4",
    "requests>=2.34.2",
    "schedule>=1.2.2",
    "sqlmodel>=0.0.39",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError"
]

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
mypy_path = "."
namespace_packages = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
